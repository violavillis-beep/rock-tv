<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ROCK-TV | Live Broadcast</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background-color: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Helvetica, Arial, sans-serif;
      color: #888;
      overflow: hidden;
    }
    #tv-frame {
      position: relative;
      width: 96vw;
      height: 82vh;
      max-width: 1600px;
      border: 3px solid #222;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
    }
    #tv-screen {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #crt-scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 3;
    }
    #channel-bug {
      position: absolute;
      bottom: 45px;
      right: 30px;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Courier New', monospace;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
    }
    #status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      color: #00ff88;
      font-size: 16px;
      z-index: 4;
      pointer-events: none;
    }
    .controls-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #555555;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { border-color: #ffffff; }
  </style>
</head>
<body>

  <div id="tv-frame">
    <div id="status-msg">TUNING SIGNAL...</div>
    <video id="tv-screen" autoplay muted loop playsinline
      onplaying="document.getElementById('status-msg').style.display='none'"
      onerror="document.getElementById('status-msg').innerText='SIGNAL BLOCKED BY NETWORK/BROWSER'">
      <source src="https://mozilla.net" type="video/mp4">
    </video>
    <div id="crt-scanlines"></div>
    <div id="channel-bug">ROCK-TV</div>
  </div>

  <div class="controls-bar">
    <button class="btn" onclick="toggleMute()" id="mute-btn">UNMUTE SOUND</button>
  </div>

  <script>
    function toggleMute() {
      const v = document.getElementById('tv-screen');
      v.muted = !v.muted;
      document.getElementById('mute-btn').innerText = v.muted ? "UNMUTE SOUND" : "MUTE SOUND";
    }
  </script>

</body>
</html>
